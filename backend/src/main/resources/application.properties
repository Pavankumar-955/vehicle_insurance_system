# Server
server.port=8090

# MySQL - Override with env: MYSQL_USER, MYSQL_PASSWORD (e.g. $env:MYSQL_PASSWORD="yourpass" in PowerShell)
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_insurance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ganesh@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=VehicleInsuranceSystemSecretKeyForJWTTokenGeneration2024SecureKey

# Expiration time in milliseconds (e.g., 86400000 ms = 1 day)
jwt.expiration=86400000 

# CORS - Frontend URL (Vite default)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
